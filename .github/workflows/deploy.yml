name: Deploy

# Builds the Vite bundles and ships the theme + blocks plugin to the server over
# SSH, then optionally re-applies page content from content/pages/.
#
# Why a build step: theme/build and plugin/build are gitignored, so a plain
# checkout has no CSS or JS at all. They are produced here and rsynced with the
# rest of the code.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      sync_content:
        description: 'Re-apply page content from content/pages/ (overwrites edits made in wp-admin)'
        type: boolean
        default: false

# One deploy at a time, and always the newest. A superseded run is cancelled
# rather than queued: every run rsyncs the whole tree, so a later one makes an
# earlier one redundant, and a run that cannot get a runner should never be able
# to block the queue behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Fail if the build produced nothing
        run: |
          test -s theme/build/main.css   || { echo "theme/build/main.css missing"; exit 1; }
          test -s theme/build/login.css  || { echo "theme/build/login.css missing"; exit 1; }
          test -s plugin/build/frontend.css || { echo "plugin/build/frontend.css missing"; exit 1; }
          test -s plugin/build/editor.js || { echo "plugin/build/editor.js missing"; exit 1; }

      # Written to a file rather than loaded into ssh-agent: agents cannot be told
      # a passphrase non-interactively, so a protected key fails with a bare
      # "Enter passphrase for (stdin)" and no clue as to why. This checks the key
      # up front and says exactly what is wrong with it.
      - name: Install the deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! head -n1 ~/.ssh/deploy_key | grep -q 'BEGIN .*PRIVATE KEY'; then
            echo "::error::SSH_KEY does not start with a BEGIN…PRIVATE KEY line."
            echo "Paste the whole private key file, including its first and last lines."
            exit 1
          fi

          # -P '' succeeds only when the key has no passphrase.
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_KEY is passphrase-protected (or corrupt). A CI runner cannot type a passphrase."
            echo "Strip it locally:  ssh-keygen -p -f <keyfile>   (leave the new passphrase empty)"
            echo "Then update the SSH_KEY secret with that file's contents."
            exit 1
          fi

          echo "Key OK — $(ssh-keygen -l -f ~/.ssh/deploy_key | awk '{print $1" "$4}')"

      - name: Trust the host
        run: |
          ssh-keyscan -p "${{ vars.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify the connection
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ vars.SSH_PORT || 22 }}" -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'echo "connected as $(whoami) on $(hostname)"'

      # The theme needs its PHP, assets and build output. src/ is build-time only.
      - name: Upload the theme
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT || 22 }}" \
            --exclude '.git*' --exclude 'src/' --exclude 'node_modules/' \
            theme/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_PATH }}/wp-content/themes/wonderland/"

      # The plugin needs src/ at runtime: inc/registration.php scans
      # src/blocks/*/block.json and each block's render.php. Do not exclude it.
      - name: Upload the blocks plugin
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT || 22 }}" \
            --exclude '.git*' --exclude 'node_modules/' \
            plugin/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_PATH }}/wp-content/plugins/wonderland-blocks/"

      - name: Upload the maintenance plugin
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT || 22 }}" \
            --exclude '.git*' \
            plugin-maintenance/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WP_PATH }}/wp-content/plugins/wonderland-maintenance/"

      - name: Upload the content records and deploy script
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ vars.SSH_PORT || 22 }}" \
            content/ scripts/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Activate, sync content, purge cache
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ vars.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "WP_PATH='${{ secrets.WP_PATH }}' \
             DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' \
             SYNC_CONTENT='${{ inputs.sync_content || 'false' }}' \
             bash '${{ secrets.DEPLOY_PATH }}/post-deploy.sh'"

      - name: Check the site still renders
        run: |
          # Accept it as either a variable or a secret — it is only a public URL,
          # but it is easy to add under the wrong tab.
          raw="${{ vars.SITE_URL }}"
          [ -n "$raw" ] || raw="${{ secrets.SITE_URL }}"

          # A pasted value often arrives with a trailing newline, or wrapped in
          # quotes. curl rejects either as a malformed URL, so trim them here.
          url=$(printf '%s' "$raw" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//')

          case "$url" in
            https://*|http://*) ;;
            "")
              echo "::error::SITE_URL is not set. Add it under Settings → Secrets and variables → Actions (Variables tab), e.g. https://example.com/path/"
              exit 1 ;;
            *)
              echo "::error::SITE_URL must begin with http:// or https:// — got ${#url} characters that do not. Check for stray quotes or spaces."
              exit 1 ;;
          esac

          # A browser-ish agent: shared hosts routinely refuse bare curl.
          ua='Mozilla/5.0 (compatible; WonderlandDeployCheck/1.0)'
          body=$(curl -sSL --retry 3 --retry-delay 5 -A "$ua" -w '\n%{http_code}' "$url") || true
          code=$(printf '%s' "$body" | tail -n1)
          html=$(printf '%s' "$body" | sed '$d')

          case "$code" in
            200)
              if printf '%s' "$html" | grep -q 'wl-'; then
                echo "OK: $url renders Wonderland block markup"
              else
                echo "::error::$url responded 200 but has no Wonderland block markup — is the blocks plugin active?"
                exit 1
              fi
              ;;
            401|403|406|429)
              # The server answered, so the deploy itself is fine — something in
              # front of it (WAF, Wordfence, bot rules) is refusing this runner.
              echo "::warning::$url returned $code, so the site could not be checked from CI. The deploy completed; verify by hand."
              ;;
            *)
              echo "::error::$url returned $code"
              exit 1
              ;;
          esac
