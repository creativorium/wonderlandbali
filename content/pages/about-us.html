<!-- wp:wonderland/media-text {"align":"full","imagePosition":"left","background":"white","imageId":1739,"imageUrl":"/wp-content/uploads/2023/08/TLM_2105.jpg","heading":"Our Story","text":"Not your typical wedding coordinator, Wonderland Bali is inspired by dreamy wedding fantasies, and they're experts at turning them into the real deal. True to our name, we are wonder-makers when it comes to real-life fairytale weddings. Our story is inspired by everyone's all-time favorite tale, \"Alice's Adventures in Wonderland\", and just like Alice, we're obsessed with fantastical scenarios, we're mad about style and décor, and we'd do anything to turn an event into a day full of wonder. Wonderland Bali Events is an international team of creatives based in Bali and Portugal, experts in bespoke weddings and events in the most romantic places in the world. They've spent 15 years in Bali, with founder and manager Anastasia Wolf at the helm and leading the creative charge."} /-->

<!-- wp:wonderland/media-text {"align":"full","imagePosition":"right","background":"greige","imageId":1939,"imageUrl":"/wp-content/uploads/2023/08/TLM_2174-1.jpg","heading":"Mad About Weddings, Serious About Service","text":"Sure, the team at Wonderland Bali Events are all about fun, fabulous fairytales, but don't let this fantastical image fool you. When it comes down to business and five-star service, there's no mucking around — these guys are professionals, and they're damn good at their job. They promise to never limit the communication process, which is exactly what you'll want when the pre-wedding panic sets in. Being flower junkies and decoration magicians, they're mad about details and style, meaning you can rest assured your Big Day will look exactly as it was planned — a fabulous, fantastical fairytale, from start to finish."} /-->

<!-- wp:wonderland/media-text {"align":"full","imagePosition":"left","background":"white","imageId":3972,"imageUrl":"/wp-content/uploads/2024/09/MAR46013-11.jpg","eyebrow":"The Team","heading":"Anastasia Wolf","text":"Hi there, my name is Anastasia Wolf and I'm the mastermind behind Wonderland Bali Events. When it comes to creating wonders on your Very Special Day, I'm your girl. As a kid I was enchanted by the \"Alice in Wonderland\" story and often organized themed tea-parties, just like the Mad Hatter would. Fast forward to the present, and here I am, living on the island of Bali — my personal Wonderland — creating real-life magic for my dear clients. I launched my own enterprise in October 2015 after 5 years in the events & luxury villa rental business. I'm a real perfectionist — call me a details junkie — and every time there is a wedding to be planned I unpack all my experience in luxury villas, gastronomy, décor and music to tailor a day full of splendour. The one to remember, and tell your grandkids about!"} /-->

<!-- wp:wonderland/media-text {"align":"full","imagePosition":"right","background":"greige","imageId":575,"imageUrl":"/wp-content/uploads/2023/06/Etty.png","eyebrow":"The Team","heading":"Etty","text":"Born as a Chinese Indonesian in North Sumatera, I realized that every couple should be treated with full heart and passion. I enjoy meeting and dealing patiently with couples. With a lot of support from trusted wedding vendors in Bali, it gives me a challenge and excitement to exceed each couple's expectations in transparent costs. As an organized and detail-oriented event planner with more than 5 years of experience — especially in Chinese weddings — I will assure you that we will have so much fun creating your perfectly-designed dream wedding into unforgettable moments that last a lifetime."} /-->
