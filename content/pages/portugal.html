<!-- wp:wonderland/media-text {"align":"full","imagePosition":"left","background":"greige","imageUrl":"/wp-content/uploads/2024/02/Ursa-editorial-276-scaled.jpg","heading":"Praia da Ursa","text":"Imagine exchanging your vows on the secluded sandy shores of Praia da Ursa, with the crashing waves and dramatic cliffs as your backdrop. This hidden gem offers a sense of intimacy and romance, creating an unforgettable setting for your elopement ceremony."} /-->

<!-- wp:wonderland/media-text {"align":"full","imagePosition":"right","background":"white","imageUrl":"/wp-content/uploads/2024/02/16716682_3lprm3w2udic40ok84k-scaled.jpg","heading":"Cabo da Roca Cliff","text":"Alternatively, venture to Cabo da Roca Cliff, Europe's westernmost point. Here, you'll find yourself standing on the edge of the world, surrounded by awe-inspiring panoramic views of the Atlantic Ocean. As the sun begins to set, painting the sky with a dreamy palette of colors, seal your love with an intimate elopement ceremony, creating memories that will last a lifetime."} /-->
